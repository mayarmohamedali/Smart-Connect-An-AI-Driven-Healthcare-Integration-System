<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Insurance Policy Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/policy.css" rel="stylesheet">

    <style>
        .d-none { display: none; }
        fieldset { margin-bottom: 20px; padding: 20px; }
        .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
        .actions { text-align: right; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Medical Insurance Policy Configuration</h2>

    <!-- POLICY TYPE -->
    <fieldset>
        <legend>Policy Type</legend>

        <div class="row">
            <div>
                <label>Category</label>
                <select id="policyCategory" onchange="togglePolicy()">
                    <option value="">-- Select --</option>
                    <option value="normal">Normal</option>
                    <option value="vip">VIP</option>
                </select>
            </div>

            <div>
                <label>Benefit Type</label>
                <select id="benefitType" onchange="togglePolicy()">
                    <option value="">-- Select --</option>
                    <option value="individual">Individual</option>
                    <option value="company">Company</option>
                </select>
            </div>
        </div>
    </fieldset>

    <!-- NORMAL - INDIVIDUAL -->
    <fieldset id="normal-individual" class="d-none">
        <legend>Normal Policy – Individual</legend>

        <div class="row">
            <div>
                <label>Annual Limit (EGP)</label>
                <input type="number">
            </div>
            <div>
                <label>Max Visits / Year</label>
                <input type="number">
            </div>
        </div>
    </fieldset>

    <!-- NORMAL - COMPANY -->
    <fieldset id="normal-company" class="d-none">
        <legend>Normal Policy – Company</legend>

        <div class="row">
            <div>
                <label>Company Size</label>
                <input type="number">
            </div>
            <div>
                <label>Annual Limit / Employee</label>
                <input type="number">
            </div>
        </div>
    </fieldset>

    <!-- VIP - INDIVIDUAL -->
    <fieldset id="vip-individual" class="d-none">
        <legend>VIP Policy – Individual</legend>

        <div class="row">
            <div>
                <label>Annual Limit (EGP)</label>
                <input type="number">
            </div>
            <div>
                <label>Private Hospitals Access</label>
                <select>
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>
        </div>
    </fieldset>

    <!-- VIP - COMPANY -->
    <fieldset id="vip-company" class="d-none">
        <legend>VIP Policy – Company</legend>

        <div class="row">
            <div>
                <label>Company Size</label>
                <input type="number">
            </div>
            <div>
                <label>Annual Limit / Employee</label>
                <input type="number">
            </div>
            <div>
                <label>VIP Network Access</label>
                <select>
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>
        </div>
    </fieldset>

    <!-- MEDICAL COVERAGE -->
    <fieldset>
        <legend>Medical Coverage</legend>

        <div class="checkbox-grid">
            <label><input type="checkbox" checked disabled> Checkup</label>
            <label><input type="checkbox" checked disabled> Operations</label>
            <label><input type="checkbox" onchange="toggleService('maternity')"> Maternity</label>
            <label><input type="checkbox" onchange="toggleService('dental')"> Dental</label>
            <label><input type="checkbox" onchange="toggleService('optical')"> Optical</label>
        </div>
    </fieldset>

    <!-- SERVICE RULES -->
    <fieldset>
        <legend>Service-Based Financial Rules</legend>

        <!-- CHECKUP -->
        <h4>Checkup / Consultation</h4>
        <div class="row">
            <div><label>Coverage (%)</label><input type="number" value="100"></div>
            <div><label>Threshold (EGP)</label><input type="number" value="10000"></div>
            <div><label>Co-Payment (%)</label><input type="number" value="0"></div>
            <div><label>Deductible (EGP)</label><input type="number" value="0"></div>
        </div>

        <!-- OPERATIONS -->
        <h4>Operations / Surgery</h4>
        <div class="row">
            <div><label>Coverage (%)</label><input type="number" value="80"></div>
            <div><label>Threshold (EGP)</label><input type="number" value="1000000"></div>
            <div><label>Co-Payment (%)</label><input type="number" value="20"></div>
            <div><label>Deductible (EGP)</label><input type="number" value="5000"></div>
        </div>

        <!-- OPTIONAL SERVICES -->
        <div id="maternity" class="d-none">
            <h4>Maternity</h4>
            <div class="row">
                <div><label>Coverage (%)</label><input type="number" value="70"></div>
                <div><label>Threshold</label><input type="number" value="50000"></div>
                <div><label>Co-Payment</label><input type="number" value="30"></div>
                <div><label>Deductible</label><input type="number" value="2000"></div>
            </div>
        </div>

        <div id="dental" class="d-none">
            <h4>Dental</h4>
            <div class="row">
                <div><label>Coverage (%)</label><input type="number" value="60"></div>
                <div><label>Threshold</label><input type="number" value="30000"></div>
                <div><label>Co-Payment</label><input type="number" value="40"></div>
                <div><label>Deductible</label><input type="number" value="1000"></div>
            </div>
        </div>

        <div id="optical" class="d-none">
            <h4>Optical</h4>
            <div class="row">
                <div><label>Coverage (%)</label><input type="number" value="50"></div>
                <div><label>Threshold</label><input type="number" value="20000"></div>
                <div><label>Co-Payment</label><input type="number" value="50"></div>
                <div><label>Deductible</label><input type="number" value="500"></div>
            </div>
        </div>

    </fieldset>

    <!-- ACTION -->
    <div class="actions">
        <button onclick="savePolicy()">Save Policy</button>
    </div>
</div>

<script>
function togglePolicy() {
    const category = document.getElementById("policyCategory").value;
    const benefit = document.getElementById("benefitType").value;

    document.querySelectorAll("fieldset[id]").forEach(f => f.classList.add("d-none"));

    if (category && benefit) {
        document.getElementById(`${category}-${benefit}`).classList.remove("d-none");
    }
}

function toggleService(id) {
    document.getElementById(id).classList.toggle("d-none");
}

function savePolicy() {
    alert("Policy Saved Successfully");
    window.location.href = "InsuranceDashboard.php";
}
</script>

</body>
</html>
